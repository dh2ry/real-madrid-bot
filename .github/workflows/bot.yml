name: Real Madrid Bot

on:
  schedule:
    - cron: "*/10 * * * *"   # كل 10 دقائق (الأخبار نفسها تنشر كل 30 دقيقة)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تجربة بدون نشر"
        type: boolean
        default: false
      preview_card:
        description: "معاينة تصميم التشكيلة فقط"
        type: boolean
        default: false
      topic:
        description: "🧵 موضوع سلسلة (اتركه فاضي للتشغيل العادي)"
        type: string
        default: ""
      topic_tweets:
        description: "عدد تغريدات السلسلة"
        type: string
        default: "8"

permissions:
  contents: write

concurrency:
  group: rm-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Run bot
        timeout-minutes: 315
        run: node bot.js ${{ inputs.preview_card && '--preview-card' || '' }}
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          TOPIC: ${{ inputs.topic }}
          TOPIC_TWEETS: ${{ inputs.topic_tweets }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      - name: Upload images (preview / dry run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: out/
          if-no-files-found: ignore

      - name: Save state
        if: ${{ always() && !inputs.dry_run && !inputs.preview_card && !inputs.topic }}
        run: |
          git config user.name "rm-bot"
          git config user.email "rm-bot@users.noreply.github.com"
          cp state/posted.json /tmp/local-state.json 2>/dev/null || exit 0
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            node lib/merge-state.js state/posted.json /tmp/local-state.json
            git add state/posted.json
            git diff --cached --quiet && exit 0
            git commit -q -m "update state" && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
